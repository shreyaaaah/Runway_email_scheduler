services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: runway, POSTGRES_PASSWORD: runway, POSTGRES_DB: runway }
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U runway"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    command: ["redis-server", "--appendonly", "yes"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
    ports: ["9200:9200"]
    volumes: ["es_data:/usr/share/elasticsearch/data"]
volumes: { postgres_data: {}, redis_data: {}, es_data: {} }
